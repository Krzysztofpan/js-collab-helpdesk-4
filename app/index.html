<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Helpdesk</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <form id="form" aria-labelledby="ticket-form-title">
        <h1 id="ticket-form-title">Nowe zgłoszenie</h1>
        <label class="title-field" for="title">
          Tytuł zgłoszenia
          <input type="text" id="title" name="title" required />
        </label>
        <label for="priority">
          Priorytet
          <select id="priority" name="priority" required>
            <option value="low">Low</option>
            <option value="medium">Normal</option>
            <option value="high">High</option>
          </select>
        </label>
        <button type="submit"><span aria-hidden="true">+</span> Dodaj zgłoszenie</button>
      </form>

      <div class="toolbar">
        <div class="board-controls">
          <label for="filter">
            Pokaż status
            <select id="filter" name="filter">
              <option value="all">Wszystkie</option>
              <option value="new">New</option>
              <option value="doing">Doing</option>
              <option value="done">Done</option>
            </select>
          </label>
          <output id="counter" aria-label="Widoczne zgłoszenia / wszystkie zgłoszenia"></output>
        </div>
        <div class="import-controls">
          <input id="inputFile" type="file" accept=".json,.csv,.xml,application/json,text/csv,application/csv,text/xml,application/xml" aria-label="Importuj plik JSON, CSV lub XML" />
          <button type="button" id="triggerGetFile">Importuj z adresu</button>
        </div>
        <p id="importError" role="status"></p>
      </div>

      <section class="board" aria-label="Tablica zgłoszeń">
        <section class="board-column" data-status="new" aria-labelledby="new-heading">
          <h2 id="new-heading">New</h2>
          <div class="board-cards"></div>
          <p class="board-empty">Brak zgłoszeń</p>
        </section>
        <section class="board-column" data-status="doing" aria-labelledby="doing-heading">
          <h2 id="doing-heading">Doing</h2>
          <div class="board-cards"></div>
          <p class="board-empty">Brak zgłoszeń</p>
        </section>
        <section class="board-column" data-status="done" aria-labelledby="done-heading">
          <h2 id="done-heading">Done</h2>
          <div class="board-cards"></div>
          <p class="board-empty">Brak zgłoszeń</p>
        </section>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
